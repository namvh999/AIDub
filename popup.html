<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lồng tiếng video AI</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img class="logo" src="icons/icon48.png" alt="Logo" width="38" height="38">
        <div>
          <h1>Lồng tiếng video AI</h1>
          <p>Dịch & lồng tiếng trực tiếp với Gemini</p>
        </div>
      </header>

      <div class="field">
        <div class="field-header">
          <label for="api-key">Gemini API Key</label>
          <a class="key-link" href="https://aistudio.google.com/apikey" target="_blank" rel="noreferrer">Lấy key ↗</a>
        </div>
        <input id="api-key" type="password" autocomplete="off" placeholder="AIzaSy…">
      </div>

      <div class="field">
        <label for="target-language">Ngôn ngữ lồng tiếng</label>
        <select id="target-language">
          <option value="vi">Tiếng Việt</option>
          <option value="en">English</option>
          <option value="af">Afrikaans</option>
          <option value="ak">Akan</option>
          <option value="sq">Albanian</option>
          <option value="am">Amharic</option>
          <option value="ar">العربية</option>
          <option value="hy">Armenian</option>
          <option value="az">Azerbaijani</option>
          <option value="eu">Basque</option>
          <option value="be">Belarusian</option>
          <option value="bn">বাংলা</option>
          <option value="bg">Bulgarian</option>
          <option value="my">Burmese</option>
          <option value="ca">Català</option>
          <option value="zh-Hans">简体中文</option>
          <option value="zh-Hant">繁體中文</option>
          <option value="hr">Croatian</option>
          <option value="cs">Čeština</option>
          <option value="da">Dansk</option>
          <option value="nl">Nederlands</option>
          <option value="et">Eesti</option>
          <option value="fil">Filipino</option>
          <option value="fi">Suomi</option>
          <option value="fr">Français</option>
          <option value="gl">Galego</option>
          <option value="ka">ქართული</option>
          <option value="de">Deutsch</option>
          <option value="el">Ελληνικά</option>
          <option value="gu">ગુજરાતી</option>
          <option value="ha">Hausa</option>
          <option value="he">עברית</option>
          <option value="hi">हिन्दी</option>
          <option value="hu">Magyar</option>
          <option value="is">Íslenska</option>
          <option value="id">Bahasa Indonesia</option>
          <option value="it">Italiano</option>
          <option value="ja">日本語</option>
          <option value="jv">Basa Jawa</option>
          <option value="kn">ಕನ್ನಡ</option>
          <option value="kk">Қазақша</option>
          <option value="km">ខ្មែរ</option>
          <option value="rw">Kinyarwanda</option>
          <option value="ko">한국어</option>
          <option value="lo">ລາວ</option>
          <option value="lv">Latviešu</option>
          <option value="lt">Lietuvių</option>
          <option value="mk">Македонски</option>
          <option value="ms">Bahasa Melayu</option>
          <option value="ml">മലയാളം</option>
          <option value="mr">मराठी</option>
          <option value="mn">Монгол</option>
          <option value="ne">नेपाली</option>
          <option value="no">Norsk</option>
          <option value="fa">فارسی</option>
          <option value="pl">Polski</option>
          <option value="pt-BR">Português (Brasil)</option>
          <option value="pt-PT">Português (Portugal)</option>
          <option value="pa">ਪੰਜਾਬੀ</option>
          <option value="ro">Română</option>
          <option value="ru">Русский</option>
          <option value="sr">Српски</option>
          <option value="sd">سنڌي</option>
          <option value="si">සිංහල</option>
          <option value="sk">Slovenčina</option>
          <option value="sl">Slovenščina</option>
          <option value="es">Español</option>
          <option value="su">Basa Sunda</option>
          <option value="sw">Kiswahili</option>
          <option value="sv">Svenska</option>
          <option value="ta">தமிழ்</option>
          <option value="te">తెలుగు</option>
          <option value="th">ไทย</option>
          <option value="tr">Türkçe</option>
          <option value="uk">Українська</option>
          <option value="ur">اردو</option>
          <option value="uz">Oʻzbekcha</option>
          <option value="zu">isiZulu</option>
        </select>
      </div>

      <div class="actions">
        <button id="toggle-btn" class="primary">
          <span id="btn-icon">▶</span>
          <span id="btn-label">Bật lồng tiếng</span>
        </button>
        <button id="apply-lang-btn" class="primary" hidden>
          <span>Áp dụng</span>
        </button>
      </div>

      <div id="status-container">
        <p id="status" role="status" aria-live="polite">Chưa bật cho trang này.</p>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
